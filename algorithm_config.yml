# OGC App Pack Generator input
# https://github.com/MAAP-Project/ogc-app-pack-generator
# Auth: run.sh loads EARTHDATA_TOKEN from MAAP Secrets (never a token job input).
algorithm_description: >
  VEDA Black Marble nighttime-lights pipeline: VIIRS VNP46A2 + Landsat + OSM
  roads → urban-focused Cloud-Optimized GeoTIFF for a bbox and date.
  Earthdata auth: run.sh resolves a MAAP secret into EARTHDATA_TOKEN for earthaccess.
algorithm_name: veda-black-marble
algorithm_version: main
keywords: ogc, black-marble, viirs, landsat, nighttime-lights, veda, maap
code_repository: https://github.com/NASA-IMPACT/veda-black-marble-ogc.git
citation: https://github.com/NASA-IMPACT/veda-black-marble
author: NASA-IMPACT
contributor: HarshiniGirish
license: https://github.com/NASA-IMPACT/veda-black-marble-ogc/blob/main/LICENSE
release_notes: OGC app pack; auth via MAAP Secrets → EARTHDATA_TOKEN env
run_command: /opt/app/run.sh
ram_min: 8192
cores_min: 2
outdir_max: 4096

inputs:
  - name: bbox
    doc: Bounding box as min_lon,min_lat,max_lon,max_lat (WGS84). Lat span >= 0.05 deg.
    label: bounding box
    type: string
  - name: date
    doc: Target date YYYY-MM-DD
    label: date
    type: string
  - name: config
    doc: Preset — default, high_quality, or fast
    label: config preset
    type: string?
  - name: osm_source
    doc: OSM backend — overpass or layercake
    label: OSM source
    type: string?
  - name: wgs84
    doc: Also export EPSG:4326 (true/false)
    label: WGS84 export
    type: string?
  - name: basename
    doc: Output filename stem written as output/<basename>.tif
    label: basename
    type: string?
  - name: earthdata_secret_name
    doc: >
      Name of the MAAP secret that stores the Earthdata token
      (not the token value). Default EARTHDATA_TOKEN.
    label: Earthdata secret name
    type: string?

outputs:
  - name: out
    type: Directory
