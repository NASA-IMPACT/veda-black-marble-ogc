# MAAP DPS / Register Algorithm UI style config
# Use with: maap.register_algorithm_from_yaml_file(...)
#
# Auth: create a MAAP secret once, then pass only the secret name:
#   MAAP().secrets.add_secret("EARTHDATA_TOKEN", "<token>")
# Never register an earthdata_token input — tokens appear in DPS logs.
algorithm_description: >
  VEDA Black Marble nighttime lights processing. Combines VIIRS VNP46A2,
  Landsat, and OSM roads into an urban-focused Cloud-Optimized GeoTIFF for
  a bbox and date. run.sh loads EARTHDATA_TOKEN from MAAP Secrets for earthaccess
  (no token job input).
algorithm_name: veda-black-marble
algorithm_version: main
repository_url: https://github.com/NASA-IMPACT/veda-black-marble-ogc.git
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v6.0.0
disk_space: 40GB
queue: maap-dps-worker-16gb
build_command: veda-black-marble-ogc/build.sh
run_command: veda-black-marble-ogc/run.sh
inputs:
  config: []
  file: []
  positional:
    - name: bbox
      description: Bounding box min_lon,min_lat,max_lon,max_lat (WGS84). Lat span must be >= 0.05 deg.
      default: "-122.55,37.69,-122.32,37.81"
      required: true
    - name: date
      description: Target date YYYY-MM-DD
      default: "2023-06-15"
      required: true
    - name: config
      description: Preset default | high_quality | fast
      default: "fast"
      required: false
    - name: osm_source
      description: overpass or layercake
      default: "overpass"
      required: false
    - name: wgs84
      description: Also export EPSG:4326 (true/false)
      default: "false"
      required: false
    - name: basename
      description: >
        Output filename stem written as output/<basename>.tif.
        Equivalent to blackmarble --output-path output/<basename>.tif
      default: "black_marble_output"
      required: false
    - name: earthdata_secret_name
      description: >
        Name of the MAAP secret that stores the Earthdata token
        (not the token value). Default EARTHDATA_TOKEN.
      default: "EARTHDATA_TOKEN"
      required: false
